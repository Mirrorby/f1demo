<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FC" />
    <title>Delokay — Панель управления</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin.css" />
    <script defer src="/admin-i18n.js?v=20261014-delokay-i18n-1"></script>\n    <script defer src="/admin/app.js?v=20261014-delokay-ui-1"></script>
  </head>
  <body class="delokay-app">
    <header class="app-header">
      <div class="app-header-main">
        <div class="brand-line">
          <span class="brand-symbol" aria-hidden="true">
            <svg viewBox="0 0 50 50" fill="none">
              <path
                d="M30 9v21c0 8-5 13-13 13S4 38 4 31s6-13 13-13c4 0 7 1 9 4"
                stroke="currentColor"
                stroke-width="6"
                stroke-linecap="round"
              />
              <rect x="28" y="24" width="17" height="19" rx="7" fill="#DDF4EC" />
              <circle cx="40" cy="9" r="5" fill="#FFD5A5" />
            </svg>
          </span>
          <span class="brand-wordmark">delokay</span>
        </div>
        <div class="store-title-block">
          <span class="eyebrow">ВАШЕ РАБОЧЕЕ ПРОСТРАНСТВО</span>
          <h1 id="store-name">Подключаем магазин…</h1>
        </div>
      </div>
      <div class="header-controls"><button id="locale-switch" type="button" aria-label="Switch to English">🇷🇺 RU</button><select id="store-picker" aria-label="Выбрать магазин" hidden></select></div>
    </header>
    <div id="notice" role="status" hidden></div>
    <main id="main"><p>Подключаем магазин…</p></main>
    <nav id="nav" aria-label="Основные разделы">
      <button data-tab="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" />
        </svg>
        <span>Главная</span>
      </button>
      <button data-tab="products" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="14" rx="2" />
          <path d="M8 7V5a4 4 0 0 1 8 0v2" />
        </svg>
        <span>Товары</span>
      </button>
      <button data-tab="orders" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="3" width="14" height="18" rx="2" />
          <path d="M9 8h6M9 12h6M9 16h4" />
        </svg>
        <span>Заказы</span>
      </button>
      <button data-tab="more" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="1.4" />
          <circle cx="12" cy="12" r="1.4" />
          <circle cx="19" cy="12" r="1.4" />
        </svg>
        <span>Ещё</span>
      </button>
    </nav>
  </body>
</html>
