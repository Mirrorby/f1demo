name: Prepare Delokay Mini App release
on:
  push:
    branches: [feat/delokay-miniapp-redesign]
    paths: [.github/workflows/delokay-miniapp-publish-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-miniapp-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run format:check && npm test
      - run: mkdir -p .deploy && npx esbuild src/index.ts --bundle --minify --format=esm --platform=browser --target=es2022 --external:cloudflare:workers --loader:.html=text --loader:.js=text --loader:.css=text --outfile=.deploy/delokay-miniapp.mjs
      - name: Store deployment candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .deploy/delokay-miniapp.mjs
          git diff --cached --quiet || (git commit -m "build: verified Delokay Mini App Worker release" && git push)
