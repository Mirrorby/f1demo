name: Verify Delokay newline hotfix live
on:
  push:
    branches: [feat/delokay-miniapp-redesign]
    paths: [.github/workflows/delokay-newline-live-smoke-once.yml]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify visible text and routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://catalog-factory.nikita-karpof.workers.dev"
          curl -fsS --max-time 20 "$base/api/health" | grep -F '"ok":true'
          curl -fsS --max-time 20 "$base/admin" > /tmp/admin.html
          curl -fsS --max-time 20 "$base/platform/editor" > /tmp/editor.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class TextOnly(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ignore = 0
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style'): self.ignore += 1
              def handle_endtag(self, tag):
                  if tag in ('script','style'): self.ignore -= 1
              def handle_data(self, data):
                  if not self.ignore: self.text.append(data)
          for path in ('/tmp/admin.html','/tmp/editor.html'):
              html = Path(path).read_text()
              assert 'delokay-theme-inline' in html
              assert 'delokay-language-inline' in html
              parser = TextOnly()
              parser.feed(html)
              texts = ''.join(parser.text)
              assert r'\n' not in texts, f'Visible escaped newline persisted: {path}'
              assert 'delokay' in texts.lower()
              print(path, 'passed')
          PY
          echo 'Live newline fix confirmed'
