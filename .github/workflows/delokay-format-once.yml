name: Format Delokay branch once
on:
  push:
    branches: [feat/delokay-bot-i18n]
    paths:
      - .github/workflows/delokay-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-bot-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegram.ts src/telegram-i18n.ts src/tribute.ts src/tribute-digital.ts scripts/telegram-setup.js tests/engine.test.js
          git diff --cached --quiet || (git commit -m "style: format Delokay localization" && git push)
