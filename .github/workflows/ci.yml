name: Verify catalog engine
on:
  pull_request:
  push:
    branches: [main, feat/catalog-factory-mvp]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm run format
      - name: Export normalized source for review
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          for (const path of execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean)) {
            console.log('TRIBUTE_NORMALIZED ' + JSON.stringify({path,content:readFileSync(path,'utf8')}));
          }
          JS
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_SCREENSHOT_DIR: test-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-screenshots
          path: test-artifacts
          retention-days: 7
      - run: npm run build
