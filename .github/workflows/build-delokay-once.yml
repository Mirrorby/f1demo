name: Build Delokay Worker once
on:
  push:
    branches: [feat/delokay-bot-i18n]
    paths: [.github/workflows/build-delokay-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-bot-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: mkdir -p .deploy && npx esbuild src/index.ts --bundle --minify --format=esm --platform=browser --target=es2022 --external:cloudflare:workers --loader:.html=text --loader:.js=text --outfile=.deploy/delokay-worker.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f .deploy/delokay-worker.mjs
          git diff --cached --quiet || (git commit -m 'build: compiled Delokay Worker for publication' && git push)
