name: Delokay newline hotfix release
on:
  push:
    branches: [feat/delokay-miniapp-redesign]
    paths: [.github/workflows/delokay-newline-hotfix-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-miniapp-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Confirm HTML defect is removed
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const path of ["public/admin.html","public/platform-editor.html"]){
              const source=readFileSync(path,"utf8");
              if(source.includes(String.raw`\n`))throw Error("Literal newline escape still in "+path);
              if(!source.includes("admin/app.js"))throw Error("Missing application script in "+path);
            }
          '
      - run: npm run check && npm run format:check && npm test
      - run: mkdir -p .deploy && npx esbuild src/index.ts --bundle --minify --format=esm --platform=browser --target=es2022 --external:cloudflare:workers --loader:.html=text --loader:.js=text --loader:.css=text --outfile=.deploy/delokay-newline-fix.mjs
      - name: Store deployment candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .deploy/delokay-newline-fix.mjs
          git diff --cached --quiet || (git commit -m "build: Delokay newline hotfix release" && git push)
