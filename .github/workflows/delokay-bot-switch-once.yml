name: Build bot switch candidate
on:
  push:
    branches: [feat/delokay-bot-i18n]
    paths:
      - .github/workflows/delokay-bot-switch-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-bot-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run check
      - run: npm test
      - run: mkdir -p .deploy && npx esbuild src/index.ts --bundle --minify --format=esm --platform=browser --target=es2022 --external:cloudflare:workers --loader:.html=text --loader:.js=text --outfile=.deploy/delokay-switch.mjs
      - name: Store release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts tests/engine.test.js
          git add -f .deploy/delokay-switch.mjs
          git diff --cached --quiet || (git commit -m "build: verified Delokay bot switch candidate" && git push)
