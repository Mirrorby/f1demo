name: Format Delokay store page once
on:
  push:
    branches: [feat/delokay-miniapp-redesign]
    paths: [.github/workflows/delokay-site-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/delokay-miniapp-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write public/admin.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.js
          git diff --cached --quiet || (git commit -m "style: format Delokay site page" && git push)
